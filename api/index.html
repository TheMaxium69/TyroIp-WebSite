<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP PUBLIC - INT804</title>
    <!-- Chargement de Tailwind CSS pour un design moderne et responsive -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">
    <!-- Conteneur principal de la page -->
    <div class="bg-gray-800 p-8 md:p-12 rounded-xl shadow-2xl max-w-lg w-full text-center border border-gray-700">
        <h1 class="text-3xl md:text-4xl font-bold mb-4 text-emerald-400 drop-shadow-lg">Adresse IP de INT804</h1>
        <p class="text-gray-400 mb-6">
            Cette page affiche l'adresse IP de int804.
        </p>

        <!-- Section où l'adresse IP sera affichée -->
        <div id="ip-container" class="bg-gray-700 rounded-lg p-6 flex flex-col items-center shadow-inner border border-gray-600 transition-all duration-500">
            <span class="text-gray-400 text-lg mb-2">L'IP du serveur est :</span>
            <div id="ip-display" class="text-green-400 text-4xl md:text-5xl font-extrabold animate-pulse">
                Chargement...
            </div>
        </div>

        <!-- Conteneur pour le message d'erreur (initialement caché) -->
        <div id="error-container" class="mt-4 p-4 bg-red-800 rounded-lg shadow-md border border-red-700 hidden transition-all duration-500">
            <p id="error-message" class="text-red-300 font-medium">
                Une erreur est survenue lors de la récupération de l'IP. Veuillez vérifier que votre serveur est bien connecté à Internet.
            </p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const ipDisplayElement = document.getElementById('ip-display');
            const ipContainerElement = document.getElementById('ip-container');
            const errorContainerElement = document.getElementById('error-container');

            try {
                // Fait une requête au script PHP local pour obtenir l'IP
                const response = await fetch('get-ip.php');

                if (!response.ok) {
                    throw new Error('Erreur réseau ou du serveur.');
                }

                const data = await response.json();

                if (data && data.ip) {
                    ipDisplayElement.textContent = data.ip;
                    // Retirer les classes d'animation pour l'état de chargement
                    ipDisplayElement.classList.remove('animate-pulse', 'text-green-400');
                    // Ajouter des classes pour l'état d'affichage réussi
                    ipDisplayElement.classList.add('animate-none', 'text-yellow-300');
                    // S'assurer que le conteneur d'erreur est masqué
                    errorContainerElement.classList.add('hidden');
                } else {
                    throw new Error("L'adresse IP n'a pas pu être trouvée dans la réponse.");
                }
            } catch (error) {
                console.error("Erreur lors de la récupération de l'IP du serveur :", error);
                // Afficher un message d'erreur plus clair
                ipDisplayElement.textContent = "Erreur";
                ipDisplayElement.classList.remove('animate-pulse', 'text-green-400');
                ipDisplayElement.classList.add('animate-none', 'text-red-400');
                // Afficher le conteneur d'erreur et le conteneur d'IP pour le style
                errorContainerElement.classList.remove('hidden');
                ipContainerElement.classList.add('bg-red-900', 'border-red-700');
                ipContainerElement.classList.remove('bg-gray-700', 'border-gray-600');
            }
        });
    </script>
</body>
</html>
